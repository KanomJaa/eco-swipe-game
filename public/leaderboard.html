<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Leaderboard — ปัดขวาพิทักษ์โลก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe0ed 0%, #e0d4ff 35%, #c0e5f7 70%, #b8f0d8 100%);
            background-attachment: fixed;
            color: #2d1b4e;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .live-badge {
            position: fixed;
            top: 16px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(45, 27, 78, 0.4);
            font-weight: 300;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff8ec7;
            border-radius: 50%;
            animation: livePulse 1.5s ease-in-out infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 4px #ff8ec7;
            }

            50% {
                opacity: 0.4;
                box-shadow: 0 0 12px #ff8ec7;
            }
        }

        .lb-header {
            text-align: center;
            padding: 40px 20px 20px;
            width: 100%;
        }

        .lb-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff8ec7, #c5a3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .lb-subtitle {
            font-size: 1rem;
            font-weight: 300;
            color: rgba(45, 27, 78, 0.4);
        }

        .lb-game-name {
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(45, 27, 78, 0.2);
            margin-top: 4px;
        }

        .podium {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            flex: 1;
        }

        .podium-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUp 0.6s ease-out both;
        }

        .podium-slot:nth-child(1) {
            animation-delay: 0.3s;
        }

        .podium-slot:nth-child(2) {
            animation-delay: 0.1s;
        }

        .podium-slot:nth-child(3) {
            animation-delay: 0.5s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .podium-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            padding: 3px;
        }

        .podium-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .podium-slot.rank-1 .podium-avatar {
            width: 110px;
            height: 110px;
            font-size: 3rem;
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            background: rgba(255, 215, 0, 0.15);
        }

        .podium-slot.rank-2 .podium-avatar {
            border: 2px solid #c0c0c0;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.3);
        }

        .podium-slot.rank-3 .podium-avatar {
            border: 2px solid #cd7f32;
            box-shadow: 0 0 20px rgba(205, 127, 50, 0.3);
        }

        .rank-badge {
            position: absolute;
            top: -42px;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.25));
            z-index: 5;
        }

        .lb-rank-badge-img {
            width: 68px;
            height: 68px;
            object-fit: contain;
        }

        .podium-slot.rank-1 .rank-badge {
            top: -56px;
        }

        .podium-slot.rank-1 .lb-rank-badge-img {
            width: 88px;
            height: 88px;
        }

        .podium-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
            max-width: 160px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .podium-slot.rank-1 .podium-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #b8860b;
        }

        .podium-score {
            font-family: 'Nunito', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .podium-slot.rank-1 .podium-score {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .podium-slot.rank-2 .podium-score {
            color: #808080;
        }

        .podium-slot.rank-3 .podium-score {
            color: #cd7f32;
        }

        .podium-stand {
            width: 140px;
            border-radius: 16px 16px 0 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 16px;
            font-family: 'Nunito', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: rgba(45, 27, 78, 0.15);
            backdrop-filter: blur(8px);
        }

        .podium-slot.rank-1 .podium-stand {
            height: 180px;
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05));
            border: 1.5px solid rgba(255, 215, 0, 0.3);
        }

        .podium-slot.rank-2 .podium-stand {
            height: 130px;
            background: linear-gradient(180deg, rgba(192, 192, 192, 0.15), rgba(192, 192, 192, 0.05));
            border: 1.5px solid rgba(192, 192, 192, 0.2);
        }

        .podium-slot.rank-3 .podium-stand {
            height: 90px;
            background: linear-gradient(180deg, rgba(205, 127, 50, 0.15), rgba(205, 127, 50, 0.05));
            border: 1.5px solid rgba(205, 127, 50, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(45, 27, 78, 0.3);
            font-size: 1.1rem;
        }

        .empty-state .empty-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
        }

        .podium-slot.updating {
            animation: updatePulse 0.5s ease;
        }

        @keyframes updatePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @media (min-width: 1200px) {
            .lb-title {
                font-size: 3.5rem;
            }

            .podium-stand {
                width: 200px;
            }

            .podium-slot.rank-1 .podium-avatar {
                width: 140px;
                height: 140px;
                font-size: 4rem;
            }
        }

        .btn-back-header {
            position: fixed;
            top: 16px;
            left: 20px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            padding: 8px 14px;
            font-family: 'Kanit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2d1b4e;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(197, 163, 255, 0.2);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-back-header:hover,
        .btn-back-header:active {
            transform: translateY(-2px) scale(1.04);
            background: rgba(255, 255, 255, 0.95);
            border-color: #ff8ec7;
            color: #ff4785;
            box-shadow: 0 6px 20px rgba(255, 142, 199, 0.3);
        }
    </style>
</head>

<body>
    <a href="/game.html?showResult=1" class="btn-back-header" id="btn-back-header">
        <span>⬅️</span> <span>ย้อนกลับ</span>
    </a>
    <div class="live-badge"><span class="live-dot"></span><span>LIVE</span></div>

    <header class="lb-header">
        <h1 class="lb-title">🏆 อันดับนักวิทย์</h1>
        <p class="lb-subtitle">ปัดขวาพิทักษ์โลก — Eco-Swipe</p>
        <p class="lb-game-name">🧪 งานวิทยาศาสตร์</p>
    </header>

    <section class="podium" id="podium">
        <div class="empty-state" id="empty-state">
            <span class="empty-emoji">🧪</span>
            <p>ยังไม่มีผู้เล่น...</p>
            <p>สแกน QR Code เพื่อเข้าเกม!</p>
        </div>
    </section>

    <script>
        const podiumEl = document.getElementById('podium');
        const emptyState = document.getElementById('empty-state');
        const MEDALS = ['🥇', '🥈', '🥉'];
        const AVATARS = ['🧑‍🔬', '👩‍🔬', '👨‍🔬'];
        let lastData = '';

        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                const top3 = data.slice(0, 3);
                const dataStr = JSON.stringify(top3);
                if (dataStr === lastData) return;
                lastData = dataStr;
                renderPodium(top3);
            } catch (err) { console.error('Leaderboard fetch error:', err); }
        }

        function renderPodium(top3) {
            if (!top3.length) { emptyState.style.display = 'block'; podiumEl.querySelectorAll('.podium-slot').forEach(el => el.remove()); return; }
            emptyState.style.display = 'none';
            const ordered = [];
            if (top3[1]) ordered.push({ ...top3[1], displayRank: 2 });
            if (top3[0]) ordered.push({ ...top3[0], displayRank: 1 });
            if (top3[2]) ordered.push({ ...top3[2], displayRank: 3 });
            podiumEl.querySelectorAll('.podium-slot').forEach(el => el.remove());
            ordered.forEach((p) => {
                const r = p.displayRank;
                const slot = document.createElement('div');
                slot.className = `podium-slot rank-${r} updating`;
                slot.innerHTML = `
          <div class="podium-avatar"><img src="/${p.avatar || 'icons/male_1.png'}" class="podium-avatar-img" alt="${esc(p.nickname)}"><span class="rank-badge"><img src="/icons/No${r}.png" class="lb-rank-badge-img" alt="Top ${r}"></span></div>
          <div class="podium-name">${esc(p.nickname)}</div>
          <div class="podium-score">${p.score.toLocaleString()}</div>
          <div class="podium-stand">#${r}</div>`;
                podiumEl.appendChild(slot);
            });
        }

        function esc(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
        fetchLeaderboard();
        setInterval(fetchLeaderboard, 5000);
    </script>
</body>

</html>
