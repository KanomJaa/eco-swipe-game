<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="ปัดขวาพิทักษ์โลก — เกมแยกขยะสุดมันส์" />
    <title>🧪 ปัดขวาพิทักษ์โลก — ลงทะเบียน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <!-- Animated background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Floating science elements -->
    <div class="floating-elements" aria-hidden="true">
        <span class="float-el" style="--delay: 0s; --x: 8%; --dur: 7s;">⚗️</span>
        <span class="float-el" style="--delay: 1.2s; --x: 22%; --dur: 9s;">🔬</span>
        <span class="float-el" style="--delay: 0.5s; --x: 45%; --dur: 6s;">🧬</span>
        <span class="float-el" style="--delay: 2s; --x: 70%; --dur: 8s;">⚛️</span>
        <span class="float-el" style="--delay: 3s; --x: 88%; --dur: 7.5s;">🧪</span>
        <span class="float-el" style="--delay: 1.8s; --x: 35%; --dur: 10s;">♻️</span>
        <span class="float-el" style="--delay: 0.8s; --x: 58%; --dur: 8.5s;">🌍</span>
        <span class="float-el" style="--delay: 2.5s; --x: 78%; --dur: 6.5s;">🔋</span>
    </div>

    <main class="container" id="app">
        <!-- Loading state -->
        <div class="loading-screen" id="loading-screen">
            <div class="spinner"></div>
            <p>กำลังตรวจสอบ...</p>
        </div>

        <!-- Nickname Form (hidden by default, shown if not registered) -->
        <div class="register-screen" id="register-screen" style="display:none;">
            <!-- Mascot: beaker character -->
            <div class="mascot" id="mascot">
                <div class="mascot-body">
                    <div class="beaker-liquid"></div>
                    <div class="mascot-face">
                        <div class="mascot-eye left"></div>
                        <div class="mascot-eye right"></div>
                        <div class="mascot-mouth"></div>
                    </div>
                </div>
                <div class="bubble b1"></div>
                <div class="bubble b2"></div>
                <div class="bubble b3"></div>
            </div>

            <div class="glass-card">
                <h1 class="title">🧪 ปัดขวาพิทักษ์โลก</h1>
                <p class="subtitle">ลงทะเบียนเข้าร่วมกิจกรรม!</p>

                <form id="nickname-form" autocomplete="off">
                    <div class="input-wrapper" id="input-wrapper">
                        <span class="input-icon">🔬</span>
                        <input type="text" id="nickname-input" placeholder="ชื่อเล่น..." maxlength="16" autofocus />
                        <span class="char-count" id="char-count">0/16</span>
                    </div>
                    <p class="error-msg" id="error-msg"></p>

                    <button type="submit" class="btn-primary" id="btn-enter">
                        <span class="btn-text">เริ่มทดลอง!</span>
                        <span class="btn-icon">🚀</span>
                        <div class="btn-shine"></div>
                    </button>
                </form>

                <div class="tips">
                    <p>💡 ชื่อต้องมี 2-16 ตัวอักษร</p>
                </div>
            </div>
        </div>

        <!-- Avatar Selection Modal Popup -->
        <div class="avatar-modal-overlay" id="avatar-modal" style="display:none;">
            <div class="avatar-modal-card">
                <h2 class="avatar-modal-title">👤 เลือกรูปโปรไฟล์</h2>
                <p class="avatar-modal-sub">เลือกอวตารของคุณเพื่อแสดงบนอันดับ!</p>

                <div class="avatar-section">
                    <div class="avatar-section-title">♂️ ชาย</div>
                    <div class="avatar-row" id="avatar-row-male">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="avatar-section">
                    <div class="avatar-section-title">♀️ หญิง</div>
                    <div class="avatar-row" id="avatar-row-female">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <button type="button" class="btn-primary" id="btn-confirm-avatar">
                    <span class="btn-text">เริ่มทดลอง!</span>
                    <span class="btn-icon">🚀</span>
                    <div class="btn-shine"></div>
                </button>
            </div>
        </div>
    </main>

    <script type="module" src="/main.js"></script>
</body>

</html>
