<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📱 QR Code — ปัดขวาพิทักษ์โลก</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe0ed 0%, #e0d4ff 35%, #c0e5f7 70%, #b8f0d8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2d1b4e;
        }

        .qr-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.3));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            padding: 40px 28px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(197, 163, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qr-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ff8ec7, #c5a3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .qr-subtitle {
            font-size: 0.9rem;
            color: rgba(45, 27, 78, 0.4);
            font-weight: 300;
            margin-bottom: 24px;
        }

        #qr-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        #qr-container canvas {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(197, 163, 255, 0.2);
        }

        .qr-url {
            display: inline-block;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 10px 18px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: #c5a3ff;
            word-break: break-all;
            margin-bottom: 16px;
        }

        .qr-instruction {
            font-size: 0.82rem;
            color: rgba(45, 27, 78, 0.35);
            font-weight: 300;
            line-height: 1.7;
        }

        .url-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .url-input-wrapper input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid transparent;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.7);
            font-family: 'Nunito', sans-serif;
            font-size: 0.85rem;
            color: #2d1b4e;
            outline: none;
            transition: all 0.3s ease;
        }

        .url-input-wrapper input:focus {
            border-color: #c5a3ff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(197, 163, 255, 0.2);
        }

        .btn-gen {
            padding: 12px 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff8ec7, #c5a3ff);
            color: #fff;
            font-family: 'Kanit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .btn-gen:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 142, 199, 0.3);
        }
    </style>
</head>

<body>
    <div class="qr-card">
        <h1 class="qr-title">📱 สแกนเข้าเกม!</h1>
        <p class="qr-subtitle">🧪 ปัดขวาพิทักษ์โลก — งานวิทยาศาสตร์</p>

        <div class="url-input-wrapper">
            <input type="text" id="url-input" placeholder="ใส่ URL ของเกม..." />
            <button class="btn-gen" id="btn-gen">สร้าง QR</button>
        </div>

        <div id="qr-container"></div>
        <p class="qr-url" id="qr-url-display" style="display:none;"></p>

        <div class="qr-instruction">
            📸 เปิดกล้องมือถือแล้วสแกน QR Code<br />
            🌐 รองรับ Chrome, Safari และเบราว์เซอร์อื่นๆ
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const urlInput = document.getElementById('url-input');
        const btnGen = document.getElementById('btn-gen');
        const qrContainer = document.getElementById('qr-container');
        const qrUrlDisplay = document.getElementById('qr-url-display');

        // Auto-detect URL
        const origin = window.location.origin;
        urlInput.value = (origin && origin !== 'null') ? origin : 'http://localhost:3000';

        function generateQR(url) {
            qrContainer.innerHTML = '';

            // Use the library
            if (typeof QRCode !== 'undefined' && QRCode.toCanvas) {
                QRCode.toCanvas(url, {
                    width: 240, margin: 2,
                    color: { dark: '#2d1b4e', light: '#ffffff' },
                }, function (err, cvs) {
                    if (err) { console.error(err); fallbackQR(url); return; }
                    cvs.style.borderRadius = '16px';
                    qrContainer.appendChild(cvs);
                    qrUrlDisplay.textContent = url;
                    qrUrlDisplay.style.display = 'inline-block';
                });
            } else {
                fallbackQR(url);
            }
        }

        // Fallback: use Google Charts QR API
        function fallbackQR(url) {
            const img = document.createElement('img');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}&color=2d1b4e`;
            img.alt = 'QR Code';
            img.style.borderRadius = '16px';
            img.style.boxShadow = '0 4px 24px rgba(197,163,255,0.2)';
            qrContainer.appendChild(img);
            qrUrlDisplay.textContent = url;
            qrUrlDisplay.style.display = 'inline-block';
        }

        // Wait for script to load then generate
        window.addEventListener('load', () => {
            setTimeout(() => generateQR(urlInput.value), 300);
        });

        btnGen.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (url) generateQR(url);
        });

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const url = urlInput.value.trim();
                if (url) generateQR(url);
            }
        });
    </script>
</body>

</html>
